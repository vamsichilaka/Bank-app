apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: bank-ingress
  namespace: bank

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

spec:
  ingressClassName: alb

  rules:
  - http:
      paths:

      - path: /
        pathType: Prefix
        backend:
          service:
            name: bank-service
            port:
              number: 80

      - path: /green
        pathType: Prefix
        backend:
          service:
            name: bank-service-green
            port:
              number: 80
